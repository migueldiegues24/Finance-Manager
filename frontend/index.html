<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Finance Manager</title>
    <script>
      // Aplica o tema antes do primeiro render, para não haver flash do tema
      // errado. Tem de coincidir com src/utils/theme.ts (THEME_STORAGE_KEY e
      // THEME_ATTRIBUTE); src/utils/theme.test.ts verifica-o.
      // Se um dia houver CSP com script-src, este script precisa de um hash
      // ou de passar para um ficheiro em public/.
      (function () {
        var mode = "system";
        try {
          mode = localStorage.getItem("theme") || "system";
        } catch (e) {}
        var dark = mode === "dark" || (mode !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        var theme = dark ? "dark" : "light";
        document.documentElement.setAttribute("data-theme", theme);
        document.documentElement.style.colorScheme = theme;
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
