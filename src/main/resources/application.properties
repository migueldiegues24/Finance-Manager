spring.application.name=financemanager
server.port=${PORT:8080}

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/financemanager}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

allowed.origins=${ALLOWED_ORIGINS:http://localhost:5173}

registration.enabled=${REGISTRATION_ENABLED:true}

jwt.secret=${JWT_SECRET}
jwt.access-token-expiration-ms=${JWT_ACCESS_EXPIRATION_MS:900000}
# Refresh token: sessão curta ("não recordar", por omissão) e "Manter sessão iniciada".
jwt.refresh-token-expiration-hours-short=${JWT_REFRESH_EXPIRATION_HOURS_SHORT:12}
jwt.refresh-token-expiration-days-remembered=${JWT_REFRESH_EXPIRATION_DAYS_REMEMBERED:14}
