spring.application.name=financemanager
server.port=${PORT:8080}
# O Railway termina o TLS no proxy; sem isto o Spring vê HTTP e não envia HSTS.
server.forward-headers-strategy=framework

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/financemanager}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

allowed.origins=${ALLOWED_ORIGINS:http://localhost:5173}

registration.enabled=${REGISTRATION_ENABLED:true}

# Tempo máximo sem receber bytes numa leitura (o padrão do Tomcat é 60 s).
server.tomcat.connection-timeout=20s
# Tempo máximo desde o início do pedido até o corpo JSON acabar de chegar
# (RequestBodyLimitFilter); o timeout acima é por leitura, não total.
request-body.read-timeout=30s

# Upload de extratos (POST /api/imports/parse): 1 MB chega para ~15x um
# extrato real de um ano (536 linhas, ~40-65 KB). O pedido inteiro leva o
# ficheiro e o campo "bank"; 5 partes chegam (o frontend envia 2).
spring.servlet.multipart.max-file-size=1MB
spring.servlet.multipart.max-request-size=2MB
server.tomcat.max-part-count=5

# IP do cliente nos limites de tentativas: ligar no Railway (ver docs/environment.md).
auth.trust-forwarded-for=${TRUST_X_FORWARDED_FOR:false}

jwt.secret=${JWT_SECRET}
jwt.access-token-expiration-ms=${JWT_ACCESS_EXPIRATION_MS:900000}
jwt.refresh-token-expiration-days=${JWT_REFRESH_EXPIRATION_DAYS:30}
